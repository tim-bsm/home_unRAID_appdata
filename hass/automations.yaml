- alias: Set default theme
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: frontend.set_theme
    metadata: {}
    data:
      mode: dark
      name: main
  mode: single
  id: 55cd2163258f48ce8de69271ec662950
- alias: Increment counter on available updates
  description: ''
  trigger:
  - platform: event
    event_type: state_changed
    event_data:
      domain: update
  condition:
    condition: template
    value_template: '"{{ trigger.event.data.entity_id.startswith(''update.'') and
      trigger.event.data.old_state.state == ''off'' and trigger.event.data.new_state.state
      == ''on'' }}"

      '
  actions:
  - action: counter.increment
    target:
      entity_id: counter.updates_available
  id: 9b0947b408e14c76b870be64e8e3b452
- alias: Decrement counter on completed updates
  description: ''
  trigger:
  - platform: event
    event_type: state_changed
    event_data:
      domain: update
  condition:
    condition: template
    value_template: '"{{ trigger.event.data.entity_id.startswith(''update.'') and
      trigger.event.data.old_state.state == ''on'' and trigger.event.data.new_state.state
      == ''off'' }}"

      '
  actions:
  - action: counter.decrement
    target:
      entity_id: counter.updates_available
  id: 5fa89a73b47849b3bd1ec9743e96ff92
- id: '1773344935228'
  alias: Waschmaschine fertig
  description: ''
  use_blueprint:
    path: sbyx/notify-or-do-something-when-an-appliance-like-a-dishwasher-or-washing-machine-finishes.yaml
    input:
      power_sensor: sensor.shelly_waschmaschine_leistung
      starting_threshold: 20
      actions:
      - action: notify.notify
        metadata: {}
        data:
          title: Die Waschmaschine ist fertig
