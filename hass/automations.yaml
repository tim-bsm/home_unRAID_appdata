    input:
      door_entity: binary_sensor.inge_wohnzimmer_sensor_oma_markise_tur
      wait_opened_long: 14400
      action_opened_long:
      - action: notify.notify
        metadata: {}
        data:
          message: Omas Markise ist seit 4 Stunden offen.
      - action: python_script.set_state
        metadata: {}
        data:
          entity_id: binary_sensor.omamarkise
          state: 'on'
      action_closed_immediate:
      - if:
        - condition: state
          entity_id: binary_sensor.omamarkise
          state:
          - 'on'
        then:
        - action: notify.notify
          metadata: {}
          data:
            message: Omas Markise ist wieder zu.
        - action: python_script.set_state
          metadata: {}
          data:
            entity_id: binary_sensor.omamarkise
            state: 'off'
