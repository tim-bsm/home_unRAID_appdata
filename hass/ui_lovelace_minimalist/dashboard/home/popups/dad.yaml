---

# This pop-up shows all entities of the specific room.
view_layout:
  grid-area: "popup"
type: "custom:bubble-card"
card_type: "pop-up"
hash: "#dad"
name: "Dad"
# entity: "scene.tim_aus"
icon: "mdi:pac-man"
width_desktop: "80%"
shadow_opacity: 70
# Make bubble card look similar to minimalist
styles: |
  .bubble-button-card-container {
    background: var(--card-background-color) !important;
  }
  .bubble-icon {
    opacity: 1 !important;
  }
  .bubble-close-button{
    background: var(--card-background-color) !important;
  }
cards:
  # Add christmas light
  - type: "custom:decluttering-card"
    # Use template defined in ../templates
    template: "template_card_bubble_light"
    variables:
      - entity: "light.smart_christmas_light_cct"
      - name: "Lichterkette"
      - icon: "mdi:string-lights"
  
  # Add homepod switch
  - type: "custom:decluttering-card"
    # Use template defined in ../templates
    template: "template_card_bubble_light"
    variables:
      - entity: "switch.shellyplug_s_4022d882e589"
      - name: "Dirigera An/Aus"
      - icon: "mdi:cast-audio-variant"

  # Add wintergarten light
  - type: "custom:decluttering-card"
    # Use template defined in ../templates
    template: "template_card_bubble_light"
    variables:
      - entity: "light.lampe_wiga"
      - name: "Wintergartenlampe"
      - icon: "mdi:wizard-hat"

  # Add living room light
  - type: "custom:decluttering-card"
    # Use template defined in ../templates
    template: "template_card_bubble_light"
    variables:
      - entity: "switch.dose_tr1_wozi"
      - name: "Stehlampe"
      - icon: "mdi:floor-lamp-torchiere-outline"

  # Garagentemperatur
  - type: "custom:decluttering-card"
    # Use template defined in ../templates
    template: "template_card_graph"
    variables:
      - name: "Garagentemperatur"
      - sensor: "sensor.hmip_th_garage_temperatur"
      - color: "red"
      - hours: 24

