---

# Add buttons to open popups of the specific rooms
view_layout:
  grid-area: "rooms"
type: "horizontal-stack"
cards:
  # Tim
  - type: "custom:button-card"
    template: "card_navigate"
    variables:
      ulm_card_navigate_path: "#tim"
      ulm_card_navigate_title: "Tim"
      ulm_card_navigate_icon: "mdi:nintendo-game-boy"
      ulm_card_navigate_color: "var(--color-red)"
  
  # Dad
  - type: "custom:button-card"
    template: "card_navigate"
    variables:
      ulm_card_navigate_path: "#dad"
      ulm_card_navigate_title: "Dad"
      ulm_card_navigate_icon: "mdi:pac-man"
      ulm_card_navigate_color: "var(--color-yellow)"

  # Top
  - type: "custom:button-card"
    template: "card_navigate"
    variables:
      ulm_card_navigate_path: "#top"
      ulm_card_navigate_title: "Oben"
      ulm_card_navigate_icon: "mdi:stairs-up"
      ulm_card_navigate_color: "var(--color-purple)"

  # Oma
  - type: "custom:button-card"
    template: "card_navigate"
    variables:
      ulm_card_navigate_path: "#oma"
      ulm_card_navigate_title: "Oma"
      ulm_card_navigate_icon: "mdi:stairs-down"
      ulm_card_navigate_color: "var(--color-green)"
  